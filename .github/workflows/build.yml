name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
# 鍵・秘密情報は使わない。pull_request では動かさない。
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: テスト
        run: dotnet test tests/TurfLab.Jv.Tests -c Release
      - name: 64bit版と32bit版のexeを作る
        run: |
          dotnet publish src/TurfLab.Cli -c Release -r win-x64 --self-contained -o out/64bit
          dotnet publish src/TurfLab.Cli -c Release -r win-x86 --self-contained -o out/32bit
          Copy-Item dist/probe_64bit.bat out/64bit/probe.bat
          Copy-Item dist/probe_32bit.bat out/32bit/probe.bat
      - name: zip にまとめる
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath TurfLab-win.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TurfLab-win
          path: TurfLab-win.zip
